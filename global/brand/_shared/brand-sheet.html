<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Brand sheet</title>
<!-- Renders a one-page brand sheet for ?brand=fuzentrix or ?brand=career-orbit (1920 wide). Values mirror each brand.yaml. -->
<style>
@font-face { font-family: Outfit; src: url(fonts/outfit-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Outfit; src: url(fonts/outfit-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Outfit; src: url(fonts/outfit-latin-900-normal.woff2); font-weight: 900; }
@font-face { font-family: Inter; src: url(fonts/inter-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Inter; src: url(fonts/inter-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Inter; src: url(fonts/inter-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains-mono-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains-mono-latin-700-normal.woff2); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0 !important; }
body { width: 1920px; background: var(--surface); font-family: Inter; color: var(--ink); padding: 64px 80px 72px; }
.lbl { font: 700 16px/1 "JetBrains Mono"; letter-spacing: .2em; text-transform: uppercase; color: var(--slate); margin-bottom: 18px; }
h1 { font: 900 64px/1 Outfit; letter-spacing: -.01em; }
h1 em { font-style: normal; color: var(--emph); }
.sub { font: 500 22px/1.4 Inter; color: var(--slate); margin-top: 14px; }
.row { display: flex; gap: 28px; margin-top: 44px; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 26px; padding: 30px; box-shadow: 0 30px 60px -22px rgba(13,39,76,.18); }
.logos { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); }
.logos > div { height: 300px; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 30px; }
.logos img { max-height: 210px; max-width: 46%; }
.sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.chip { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.chip .c { height: 92px; }
.chip .t { padding: 12px 14px; font: 600 15px/1.35 Inter; }
.chip .t b { display: block; font: 700 15px/1 "JetBrains Mono"; margin-bottom: 6px; }
.chip .t span { color: var(--slate); font-weight: 500; }
.grad { height: 26px; border-radius: 13px; margin-top: 18px; }
.type div { margin-top: 10px; }
.code { border-radius: 22px; background: linear-gradient(160deg,#13274A,#0B1730); padding: 22px 26px; font: 700 26px/1.7 "JetBrains Mono"; color: #fff; position: relative; }
.kw { color: #7DD3FC; } .fn { color: #FBBF24; } .num { color: #6EE7B7; } .cm { color: #7B8BA5; }
.hl { border: 3px solid var(--hl); border-radius: 8px; padding: 0 4px; margin: 0 -7px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--hl) 25%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font: 600 22px/1 Inter; box-shadow: 0 18px 40px -14px rgba(13,39,76,.25); }
.ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--accent); font: 800 22px/1 Outfit; }
.note .nt { display: inline-block; font: 700 22px/1 "JetBrains Mono"; background: var(--tint); padding: 8px 12px; border-radius: 10px; color: var(--ink); }
.note .nd { font: 600 24px/1.3 Outfit; margin-top: 10px; } .note .nd b { color: var(--emph2); }
</style></head>
<body>
<script>
const B = {
  "fuzentrix": {
    name: "Fuzentrix Education", dir: "../fuzentrix/",
    logos: ["fuzentrix_logo.svg", "fuzentrix_logo_horizontal.svg"], dark: ["fuzentrix_logo_on-dark.svg", "fuzentrix_logo_horizontal_on-dark.svg"],
    vars: { ink: "#0D274C", slate: "#5C6B80", surface: "#F3F6FA", tint: "#ECF6FB", line: "#E1E7EF", emph: "#3381C2", emph2: "#205487", accent: "#3381C2", hl: "#D9731D", dark: "#0D274C" },
    colors: [["ink", "#0D274C", "Text, headings"], ["brand-blue", "#3381C2", "Accent, title emphasis"], ["brand-mid", "#205487", "Small-text emphasis"], ["coral", "#CF501B", "Calls to action"],
             ["orange", "#D9731D", "Highlights, wires"], ["cyan", "#38BDF8", "Accent on dark"], ["slate", "#5C6B80", "Secondary text"], ["surface", "#F3F6FA", "Page base"],
             ["tint", "#ECF6FB", "Pills, icon wells"], ["line", "#E1E7EF", "Card borders"], ["charcoal", "#1A1A1A", "Logo EDUCATION only"], ["success", "#12A150", "Shared · danger #E5484D"]],
    grad: "linear-gradient(90deg,#0D274C,#3381C2)", gname: "logo gradient · #0D274C → #3381C2",
  },
  "career-orbit": {
    name: "Career Orbit", dir: "../career-orbit/",
    logos: ["careerorbit_logo.svg", "careerorbit_logo_horizontal.svg"], dark: ["careerorbit_logo_on-dark.svg", "careerorbit_logo_horizontal_on-dark.svg"],
    vars: { ink: "#0D274C", slate: "#52657D", surface: "#EFF5FB", tint: "#EFF5FB", line: "#DDE9F6", emph: "#30809F", emph2: "#1B53A2", accent: "#1B53A2", hl: "#F6AD55", dark: "#0D274C" },
    colors: [["navy", "#0D274C", "Text · LMS brand-900"], ["action", "#1B53A2", "Buttons, small emphasis"], ["teal", "#16BBC8", "Accent · never text on white"], ["orbit-text", "#30809F", "Title emphasis"],
             ["deep", "#081830", "Dark panels · LMS"], ["action-hover", "#174484", "Hover · LMS brand-700"], ["slate", "#52657D", "Secondary text"], ["line", "#DDE9F6", "Borders · LMS brand-100"],
             ["tint", "#EFF5FB", "Pills, page · LMS brand-50"], ["surface-warm", "#FBFAF7", "LMS navbar, shell"], ["warning", "#F6AD55", "Highlights, wires"], ["success", "#12A150", "Shared · danger #E5484D"]],
    grad: "linear-gradient(90deg,#164673,#145695,#1790B4,#16BBC8)", gname: "orbit gradient (logo) · #164673 → #16BBC8 · deep gradient (LMS) · #0D274C → #081830",
  },
};
const id = new URLSearchParams(location.search).get("brand") || "fuzentrix", b = B[id];
for (const k in b.vars) document.documentElement.style.setProperty("--" + k, b.vars[k]);
const darkCell = b.dark.length ? b.dark.map((f) => `<img src="${b.dir}${f}">`).join("") : `<div style="color:#fff;font:600 22px/1.4 Inter;text-align:center;opacity:.85">On-dark version<br>still to generate</div>`;
document.body.insertAdjacentHTML("beforeend", `
  <div class="lbl">Brand kit · ${id}</div>
  <h1>${b.name} <em>brand sheet</em></h1>
  <div class="sub">Logo, colour roles, type and on-screen elements. Typography, shapes, motion and sound are shared by every Fuzentrix brand (_shared/house.yaml).</div>
  <div class="row"><div style="flex:1"><div class="lbl">Logo · light and dark</div>
    <div class="logos"><div style="background:#fff">${b.logos.map((f) => `<img src="${b.dir}${f}">`).join("")}</div><div style="background:${b.vars.dark}">${darkCell}</div></div></div></div>
  <div class="row"><div style="flex:1"><div class="lbl">Colour roles</div>
    <div class="sw">${b.colors.map(([n, h, r]) => `<div class="chip"><div class="c" style="background:${h}"></div><div class="t"><b>${h}</b>${n}<br><span>${r}</span></div></div>`).join("")}</div>
    <div class="grad" style="background:${b.grad}"></div><div class="sub" style="font-size:16px;margin-top:8px">${b.gname}</div></div></div>
  <div class="row">
    <div class="panel type" style="flex:1.1"><div class="lbl">Type</div>
      <div style="font:900 64px/1 Outfit">Loop control <span style="color:var(--emph)">statements</span></div>
      <div style="font:800 40px/1.1 Outfit">Outfit · titles and headings</div>
      <div style="font:600 28px/1.35 Inter;color:var(--ink)">Inter · body text, chips and labels. Readable at 26 px and up.</div>
      <div style="font:700 26px/1 'JetBrains Mono'">JetBrains Mono · if i == 6: break</div></div>
    <div class="panel" style="flex:1"><div class="lbl">On-screen elements</div>
      <div class="code"><span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">1</span>, <span class="num">11</span>):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> i == <span class="num">6</span>:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="hl kw">break</span></div>
      <div style="display:flex;gap:18px;align-items:center;margin-top:22px"><div class="pill"><div class="ic">1</div>Read n</div>
      <div class="panel note" style="padding:18px 22px;box-shadow:none"><div class="nt">break</div><div class="nd">Exits the loop <b>immediately</b></div></div></div></div>
  </div>`);
</script>
</body></html>
