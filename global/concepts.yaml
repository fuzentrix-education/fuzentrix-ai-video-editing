# Concept moments (rules V3, V5): one collection for every course, technical and non-technical. When the instructor names a
# concept, the screen should SHOW it with one of its templates, starting on the word (design §7.3). `fzv plan` lists every moment
# it finds in the transcript, with the templates that show it (freshest first); Claude uses the ones that fit the lesson and skips a
# match that means something else here (a word in the beat's notes). `fzv beats` and `fzv validate` report uncovered moments (V3).
#
#   id          unique
#   phrases     matched word for word in the English-mode transcript (romanised Telugu is common). Case, punctuation and plurals
#               don't matter, and where two phrases overlap the longer one wins. Keep them specific: two or more words when one word
#               is common speech or means different things in different subjects ("conversion rate", not "conversion"; "seo
#               keywords", not "keywords"). A phrase belongs to one concept only.
#   templates   best first, at least two 2D ones, so a concept that comes back can be shown another way (rule V5). Brand templates
#               first, registry animations (hf:<item>) after them; 3D and sketch only as extra options (used only when the prompt
#               asks). Never scene or cutaway (rule L11).
#   show        what moves on screen for this concept
#   gap         optional: seconds before the concept is listed again (default 45; 12 for iterations, 90-120 for a lesson's topic word)
#
# The sections are only for finding things: every concept is available to every video. The team adds concepts freely; check with
#   .venv/bin/python -m pytest tests/test_core.py -k concept
concepts:

  # ======== General: comparisons, steps, numbers, examples, definitions, recaps (every subject)
  - id: compare
    phrases: ["difference between", "versus", " vs ", "compared to", "compare the two", "comparison between"]
    templates: [contrast, table, type-cards, hf:comparison-split]
    show: "the two side by side, each difference landing on its word"
  - id: before-after
    phrases: ["before and after", "before vs after", "earlier it was", "after the change", "with and without"]
    templates: [contrast, process-flow, hf:comparison-split]
    show: "the before state, then the after state wiping in over it; what changed glows"
  - id: steps
    phrases: ["step by step", "first step", "step one", "step 1", "second step", "next step", "final step", "last step", "the steps are"]
    templates: [agenda, flowchart, checklist, hf:state-chip-rail]
    show: "the steps appearing in order, the current one lit as the instructor reaches it"
  - id: how-it-works
    phrases: ["how it works", "how does it work", "behind the scenes", "under the hood", "works internally", "the process is", "the process of"]
    templates: [process-flow, blocks, flowchart, request-flow]
    show: "the mechanism moving part by part: what goes in, what happens inside, what comes out"
  - id: many-items
    phrases: ["10,000", "10000", "thousands of", "lakhs of", "crores of", "millions of", "billions of", "thousand students", "1000s", "huge amount of"]
    templates: [icon-grid, counter, bars, hf:count-up]
