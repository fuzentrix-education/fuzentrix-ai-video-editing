- name: code-terminal-run
  type: component
  file: code-terminal-run/code-terminal-run.html
  title: Code Terminal Run
  description: 'A token-chrome terminal panel runs one command: the prompt line types deterministically behind an integer-cycle caret, executes after a beat, and output lines print one per cue before a
    fresh prompt appears.'
  tags:
  - motion-primitive
  - product-demo
  - terminal
  - typing
  - deterministic
  duration: null
  size: null
  variables:
  - id: prompt_glyph
    type: string
    description: Leading glyph before the command and the trailing prompt. Empty string hides it.
    default: $
  - id: cadence
    type: enum
    description: 'Keystroke rhythm: uniform fixed steps or seeded human chunks.'
    default: human
    options:
    - value: uniform
      label: Uniform
    - value: human
      label: Human
  - id: cues
    type: string
    description: Comma-separated seconds relative to mount start; cue N sets when output line N prints. Empty uses the authored rhythm.
    default: ''
  - id: accent
    type: enum
    description: Color of the prompt glyph and caret.
    default: green
    options:
    - value: green
      label: Green
    - value: blue
      label: Blue
    - value: violet
      label: Violet
  - id: exit
    type: enum
    description: Outgoing transition. Frame roots own transitions; none holds the end frame.
    default: none
    options:
    - value: none
      label: None
    - value: fade
      label: Fade
    - value: up
      label: Up
  source: https://github.com/heygen-com/hyperframes/tree/main/registry/code-terminal-run
  licence: Apache-2.0 (HyperFrames registry)
  comp_id: code-terminal-run
- name: comparison-split
  type: component
  file: comparison-split/comparison-split.html
  title: Comparison Split
  description: Two full-bleed panels compare before and after states as a persistent divider wipes the vivid after layer over the muted before layer and rests at a configurable split.
  tags:
  - prop
  - ui-props
  - compare
  - holdable
  - before-after
  - wipe
  duration: null
  size: null
  variables:
  - id: split
    type: number
    description: Target resting position of the comparison divider.
    default: 50
  - id: orientation
    type: enum
    description: Axis and direction used by the comparison wipe.
    default: horizontal
    options:
    - value: horizontal
      label: Horizontal
    - value: vertical
      label: Vertical
  - id: labelA
    type: string
    description: Caption shown on the base before panel.
    default: Before
  - id: labelB
    type: string
    description: Caption shown on the revealed after panel.
    default: After
  source: https://github.com/heygen-com/hyperframes/tree/main/registry/comparison-split
  licence: Apache-2.0 (HyperFrames registry)
  comp_id: comparison-split
