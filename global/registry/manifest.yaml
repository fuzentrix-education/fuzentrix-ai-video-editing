# Vendored HyperFrames registry items (fzv registry add). Mount with the `hf` template.
items:
- name: browser-device-stage
  type: component
  file: browser-device-stage/browser-device-stage.html
  title: Browser Device Stage
  description: A generic app surface in token-native device chrome (browser, window, or phone). The screen is a slot for caller img/video/HTML with a token-styled skeleton default; one settle entrance,
    a readable hold, and an optional screen swap.
  tags:
  - stage
  - product-demo
  - device
  - browser
  - phone
  - slot
  - chrome
  duration: null
  size: null
  variables:
  - id: chrome
    type: enum
    description: Device frame drawn around the screen slot.
    default: browser
    options:
    - value: browser
      label: Browser
    - value: window
      label: Window
    - value: phone
      label: Phone
  - id: title
    type: string
    description: Address pill text (browser) or title bar text (window).
    default: app.example.com
  - id: swap_at
    type: number
    description: Seconds from mount start to swap to the second screen. 0 disables the swap.
    default: 0
  - id: accent
    type: enum
    description: Token the skeleton accent elements ride.
    default: green
    options:
    - value: green
      label: Green
    - value: blue
      label: Blue
    - value: violet
      label: Violet
  - id: exit
    type: enum
    description: Optional departure. None holds the final frame.
    default: none
    options:
    - value: none
      label: None
    - value: fade
      label: Fade
    - value: up
      label: Up
  source: https://github.com/heygen-com/hyperframes/tree/main/registry/browser-device-stage
  licence: Apache-2.0 (HyperFrames registry)
  comp_id: browser-device-stage
- name: chart-story
  type: component
  file: chart-story/chart-story.html
  title: Chart Story
  description: 'One chart builds from data in reading order and lands the exact supplied values: staggered bars, a left-to-right line with area fill, a sweeping donut, or filling progress bars, with an
    accented value callout on the emphasized datum.'
  tags:
  - motion-primitive
  - proof
  - stats
  - chart
  - bars
  - line
  - donut
  - progress
  - deterministic
  duration: null
  size: null
  variables:
  - id: type
    type: enum
    description: Chart form the data builds into.
    default: bars
    options:
    - value: bars
      label: Bars
    - value: line
      label: Line
    - value: donut
      label: Donut
    - value: progress
      label: Progress
  - id: data
    type: string
    description: Comma-separated numbers; the chart lands exactly on these values.
    default: 12, 28, 45, 64
  - id: labels
    type: string
    description: Comma-separated labels, one per datum.
    default: Q1, Q2, Q3, Q4
  - id: emphasize
    type: number
    description: Index of the datum that takes the accent and the value callout. Clamped to the data range.
    default: 3
  - id: unit
    type: string
    description: Suffix appended to every displayed value.
    default: '%'
  - id: accent
    type: enum
    description: Contract color used by the emphasized datum and its callout.
    default: green
    options:
    - value: green
      label: Green
    - value: blue
      label: Blue
    - value: violet
      label: Violet
  - id: exit
    type: enum
    description: Optional departure. Proof stats end on the still hold, so the default is none.
    default: none
    options:
    - value: none
      label: None
    - value: fade
      label: Fade
    - value: up
      label: Up
  source: https://github.com/heygen-com/hyperframes/tree/main/registry/chart-story
  licence: Apache-2.0 (HyperFrames registry)
  comp_id: chart-story
- name: chat-message
  type: component
  file: chat-message/chat-message.html
  title: Chat Message
  description: 'One message arrives on the measured entry - scale 0.75, 0.12s, growing from its sender''s corner. The type is an enum switched like marker-highlight''s style: a received or sent bubble with
    a real tail, a large emoji row, an image, or a link card with title and domain. The atom that chat-thread builds conversations from'
  tags:
  - video-primitive
  - chat
  - mock-ui
  - message
  duration: null
  size: null
  variables:
  - id: type
    type: enum
    description: Which message form arrives.
    default: sent
    options:
    - value: recv
      label: Received
    - value: sent
      label: Sent
    - value: emoji
      label: Emoji
    - value: img
      label: Image
    - value: card
      label: Link card
  - id: text
    type: string
    description: Bubble text, or the emoji row for the Emoji type.
    default: wait look 👀
  - id: cardTitle
    type: string
    description: Link-card title (Link card type only).
    default: HyperFrames — Write HTML, render pixel-perfect video
  - id: cardDomain
    type: string
    description: Link-card domain line (Link card type only).
    default: hyperframes.heygen.com
  - id: tail
    type: enum
    description: The bubble tail anchoring the message to its side.
    default: 'on'
    options:
    - value: 'on'
      label: 'On'
    - value: 'off'
      label: 'Off'
  - id: delivered
    type: enum
    description: The receipt under a sent message.
    default: 'on'
    options:
    - value: 'on'
      label: 'On'
    - value: 'off'
      label: 'Off'
  source: https://github.com/heygen-com/hyperframes/tree/main/registry/chat-message
  licence: Apache-2.0 (HyperFrames registry)
  comp_id: chat-message
